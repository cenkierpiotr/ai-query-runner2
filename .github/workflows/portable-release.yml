name: Portable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            zip_name: ai-query-runner-linux-x64.zip
            binary: ai-query-runner
          - os: windows-latest
            target: bun-windows-x64
            zip_name: ai-query-runner-windows-x64.zip
            binary: ai-query-runner.exe
          - os: macos-latest
            target: bun-darwin-x64
            zip_name: ai-query-runner-macos-x64.zip
            binary: ai-query-runner

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download Chromium
        run: npx playwright install chromium

      - name: Prepare output directory
        shell: bash
        run: mkdir -p dist/portable/public

      - name: Compile binary
        shell: bash
        run: |
          bun build src/index.ts --compile --target=${{ matrix.target }} \
            --external playwright --external playwright-core --external chromium-bidi \
            --outfile=dist/portable/${{ matrix.binary }}

      - name: Copy public assets
        shell: bash
        run: cp -r src/public/. dist/portable/public/

      - name: Copy playwright runtime (external dependency)
        shell: bash
        run: |
          mkdir -p dist/portable/node_modules
          for pkg in playwright playwright-core; do
            [ -d "node_modules/$pkg" ] && cp -r "node_modules/$pkg" dist/portable/node_modules/
          done

      - name: Copy Chromium (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          CHROMIUM_DIR=$(node -e "
            const {chromium} = require('playwright');
            const p = chromium.executablePath();
            if (typeof p === 'string') {
              const path = require('path');
              console.log(path.dirname(path.dirname(p)));
            } else {
              p.then(exe => {
                const path = require('path');
                console.log(path.dirname(path.dirname(exe)));
              });
            }
          ")
          cp -r "$CHROMIUM_DIR" dist/portable/chromium

      - name: Copy Chromium (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $chromiumExe = node -e "
            const {chromium}=require('playwright');
            const p=chromium.executablePath();
            if(typeof p==='string'){process.stdout.write(p)}else{p.then(exe=>process.stdout.write(exe))}
          "
          $chromiumDir = Split-Path (Split-Path $chromiumExe -Parent) -Parent
          Copy-Item -Recurse -Force $chromiumDir dist\portable\chromium

      - name: Create .portable marker
        shell: bash
        run: touch dist/portable/.portable

      - name: Create ZIP (Linux / macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist
          zip -r ${{ matrix.zip_name }} portable/

      - name: Create ZIP (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\portable\* `
            -DestinationPath dist\${{ matrix.zip_name }} -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip_name }}
          path: dist/${{ matrix.zip_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: ${{ github.ref_name || inputs.tag }}
          body: |
            ## 🤖 AI Query Runner ${{ github.ref_name || inputs.tag }}

            Dwie wersje do wyboru — pobierz tę która pasuje do Twojego przypadku.

            ---

            ## 📦 Wersja portable — uruchom bez instalacji

            Skompilowana do jednego folderu. Nie wymaga Node.js ani npm. Pobierz, rozpakuj, uruchom.

            | System | Plik |
            |--------|------|
            | 🐧 Linux x64 | `ai-query-runner-linux-x64.zip` |
            | 🪟 Windows x64 | `ai-query-runner-windows-x64.zip` |
            | 🍎 macOS x64 | `ai-query-runner-macos-x64.zip` |

            **Jak uruchomić:**
            1. Pobierz ZIP dla swojego systemu z listy Assets poniżej
            2. Rozpakuj do dowolnego folderu
            3. Uruchom:
               - **Linux/macOS:** `./ai-query-runner` w terminalu (może wymagać `chmod +x ai-query-runner`)
               - **Windows:** kliknij dwukrotnie `ai-query-runner.exe`
            4. Panel otwiera się automatycznie pod adresem **http://localhost:3535**

            > Duży rozmiar wynika z dołączonego Chromium (~150–450 MB zależnie od platformy) — przeglądarka jest potrzebna do trybu automatyzacji (Gemini, Claude, Perplexity itd.). Tryb API (Gemini API, OpenRouter, Ollama) nie używa Chromium.

            ---

            ## 🛠️ Wersja standardowa — instalacja z kodem źródłowym

            Wymaga Node.js 18+. Lepsza do długoterminowego użytku i własnych modyfikacji.

            ```bash
            git clone https://github.com/cenkierpiotr/ai-query-runner2.git
            cd ai-query-runner2
            bash install.sh        # Linux/macOS
            # lub install.bat      # Windows
            ```

            Alternatywnie pobierz **Source code (zip)** z Assets poniżej i rozpakuj ręcznie.

            ---

            ## ❓ Którą wersję wybrać?

            | | Portable | Standardowa |
            |--|---------|------------|
            | Wymaga Node.js | ❌ Nie | ✅ Tak |
            | Rozmiar | ~200–500 MB | ~400–600 MB po instalacji |
            | Aktualizacje | Pobierz nowy ZIP | `git pull` + `npm install` |
            | Własne modyfikacje | Trudniejsze | Łatwe |
          files: artifacts/*.zip
          generate_release_notes: false
