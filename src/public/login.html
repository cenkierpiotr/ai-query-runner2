<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Query Runner — logowanie</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo h1 { color: #f1f5f9; font-size: 1.25rem; font-weight: 600; }
    .logo p  { color: #64748b; font-size: .85rem; margin-top: 4px; }
    label { display: block; color: #94a3b8; font-size: .8rem; font-weight: 500;
            text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 10px 14px; border: 1px solid #334155;
      border-radius: 8px; background: #0f172a; color: #f1f5f9;
      font-size: .95rem; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #6366f1; }
    .field { margin-bottom: 18px; }
    button[type="submit"] {
      width: 100%; padding: 11px; background: #6366f1; color: #fff;
      border: none; border-radius: 8px; font-size: .95rem; font-weight: 500;
      cursor: pointer; transition: background .15s; margin-top: 4px;
    }
    button[type="submit"]:hover { background: #4f46e5; }
    button[type="submit"]:disabled { background: #3730a3; cursor: not-allowed; }
    .error { color: #f87171; font-size: .85rem; margin-top: 14px; min-height: 20px; text-align: center; }
    #totpField { display: none; }
    input[inputmode="numeric"] { letter-spacing: .3em; text-align: center; font-size: 1.2rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🤖 AI Query Runner</h1>
    <p>Zaloguj się, żeby kontynuować</p>
  </div>
  <form id="loginForm">
    <div class="field">
      <label for="password">Hasło</label>
      <input type="password" id="password" autocomplete="current-password" autofocus required>
    </div>
    <div class="field" id="totpField">
      <label for="totpCode">Kod weryfikacyjny (aplikacja 2FA)</label>
      <input type="text" id="totpCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
    </div>
    <button type="submit" id="submitBtn">Zaloguj się</button>
    <p class="error" id="errorMsg"></p>
  </form>
</div>
<script>
  let totpRequired = false;

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = 'Logowanie…';
    err.textContent = '';

    const body = { password: document.getElementById('password').value };
    if (totpRequired) body.totpCode = document.getElementById('totpCode').value;

    try {
      const r = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await r.json();
      if (r.ok) {
        window.location.href = '/';
      } else if (data.totpRequired) {
        totpRequired = true;
        document.getElementById('totpField').style.display = 'block';
        document.getElementById('totpCode').focus();
        err.textContent = 'Wpisz kod z aplikacji uwierzytelniającej.';
      } else {
        err.textContent = data.error || 'Błąd logowania.';
      }
    } catch {
      err.textContent = 'Błąd połączenia z serwerem.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Zaloguj się';
    }
  });
</script>
</body>
</html>
